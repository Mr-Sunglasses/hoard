services:
  hoard:
    build: .
    # Or run a published release instead of building it here (see docs/DEPLOYMENT.md):
    # image: ghcr.io/mr-sunglasses/hoard:1
    container_name: hoard
    restart: unless-stopped
    init: true                     # reaps finished download processes
    # Run as your NAS user so the downloaded files are owned by you, not root.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      # Docker's published ports skip ufw rules on Ubuntu. To limit who can connect, set
      # BIND_ADDRESS to one of the server's own IPs (e.g. its LAN IP), or 127.0.0.1 behind a reverse proxy.
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}:8080"
    volumes:
      # Left side: the folder on your NAS where models are stored. Change it to your path.
      - /srv/models:/models
      # App settings (saved token, download list). Keep this out of any shared folder.
      - ./config:/config
    environment:
      - APP_PASSWORD=${APP_PASSWORD:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - MAX_PARALLEL_DOWNLOADS=${MAX_PARALLEL_DOWNLOADS:-2}
      - MIN_FREE_GB=${MIN_FREE_GB:-2}

    # Hardening: nothing in the container can be changed except the two volumes and /tmp,
    # no Linux capabilities, and no way to gain privileges.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256

    # Keep logs from filling the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

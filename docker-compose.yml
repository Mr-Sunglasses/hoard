services:
  hoard:
    build: .
    container_name: hoard
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Left side: the folder on your NAS where models are stored. Change it to your path.
      - /srv/models:/models
      # App settings (the Hugging Face token saved from the UI). Keep this out of any shared folder.
      - ./config:/config
    environment:
      # Optional: Hugging Face token for gated/private models (Llama, Gemma, ...).
      # You can also add it from the UI (Settings). If set here, it wins and the UI can't change it.
      - HF_TOKEN=${HF_TOKEN:-}
      # Optional: set a password to protect the web UI (any username works).
      - APP_PASSWORD=${APP_PASSWORD:-}
    # Run as your NAS user so the downloaded files are owned by you, not root.
    user: "${PUID:-1000}:${PGID:-1000}"

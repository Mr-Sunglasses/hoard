<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hoard</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">

  <script src="/static/js/theme-init.js"></script>

  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/views.css">
  <script type="module" src="/static/js/main.js"></script>
</head>
<body>

  <!-- Pencil filters for the .sk outlines (CSS can only reference filters defined in the page). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="G" yChannelSelector="R"/>
    </filter>
  </svg>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark sk"><svg class="i"><use href="/static/icons.svg#i-cube"/></svg></span>
      <div class="brand-name">Hoard<small>your Hugging Face shelf</small></div>
    </div>

    <nav class="tabs">
      <button class="tab active" data-tab="library">Library</button>
      <button class="tab" data-tab="browse">Browse<span class="wide-only">&nbsp;Hugging Face</span></button>
      <button class="tab" data-tab="downloads">Downloads<span class="count" id="downloads-count" hidden></span></button>
    </nav>

    <div class="top-actions">
      <button class="btn ghost icon" id="settings-open" title="Settings"><svg class="i"><use href="/static/icons.svg#i-sliders"/></svg></button>
      <button class="btn ghost icon" id="theme-toggle" title="Paper / chalkboard"></button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main>
    <!-- ============================ Library ============================ -->
    <section id="tab-library">
      <div class="stats">
        <div class="stat sk">
          <div class="stat-label">models on the shelf</div>
          <div class="stat-value" id="stat-count">–</div>
          <div class="stat-sub" id="stat-count-detail">&nbsp;</div>
        </div>
        <div class="stat sk">
          <div class="stat-label">space they take</div>
          <div class="stat-value" id="stat-size">–</div>
          <div class="stat-sub" id="stat-size-detail">&nbsp;</div>
        </div>
        <div class="stat sk">
          <div class="stat-label">free on disk</div>
          <div class="stat-value" id="stat-free">–</div>
          <div class="stat-sub mono" id="stat-free-detail">&nbsp;</div>
          <div class="meter sk" id="disk-meter"><div class="mine"></div><div class="other"></div></div>
        </div>
      </div>

      <div class="toolbar">
        <label class="field sk thin">
          <svg class="i"><use href="/static/icons.svg#i-search"/></svg>
          <input type="text" id="library-filter" placeholder="Filter your models…">
        </label>
        <span class="select sk thin">
          <select id="library-format"><option value="">All formats</option></select>
        </span>
        <span class="select sk thin">
          <select id="library-sort">
            <option value="recent">Recently saved</option>
            <option value="name">Name</option>
            <option value="size">Biggest first</option>
          </select>
        </span>
        <button class="btn" id="check-all">
          <svg class="i"><use href="/static/icons.svg#i-refresh"/></svg><span class="wide-only">Check for updates</span>
        </button>
      </div>

      <div id="library-list"></div>
    </section>

    <!-- ============================ Browse ============================ -->
    <section id="tab-browse" hidden>
      <form class="toolbar" id="search-form">
        <label class="field sk thin">
          <svg class="i"><use href="/static/icons.svg#i-search"/></svg>
          <input type="text" id="search-query" autocomplete="off"
                 placeholder="Search models, or paste a repo id like Qwen/Qwen2.5-7B-Instruct">
        </label>
        <span class="select sk thin">
          <select id="search-task">
            <option value="">Any task</option>
            <option value="text-generation">Text generation</option>
            <option value="image-text-to-text">Vision + text</option>
            <option value="automatic-speech-recognition">Speech recognition</option>
            <option value="text-to-speech">Text to speech</option>
            <option value="text-to-image">Text to image</option>
            <option value="feature-extraction">Embeddings</option>
            <option value="sentence-similarity">Sentence similarity</option>
            <option value="text-classification">Text classification</option>
            <option value="translation">Translation</option>
            <option value="image-classification">Image classification</option>
            <option value="object-detection">Object detection</option>
          </select>
        </span>
        <span class="select sk thin">
          <select id="search-sort">
            <option value="trending_score">Trending</option>
            <option value="downloads">Most downloaded</option>
            <option value="likes">Most liked</option>
            <option value="last_modified">Recently updated</option>
          </select>
        </span>
      </form>

      <p class="caption" id="search-caption"></p>
      <div id="search-results"></div>
    </section>

    <!-- ============================ Downloads ============================ -->
    <section id="tab-downloads" hidden>
      <div class="page-head">
        <div>
          <h2>Downloads</h2>
          <p>Stopped or failed ones pick up where they left off when you resume them.</p>
        </div>
        <button class="btn" id="clear-downloads">Clear finished</button>
      </div>
      <div id="downloads-list"></div>
    </section>
  </main>

  <!-- Overlays (filled by js/ui/overlay.js) -->
  <div class="backdrop" id="backdrop" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" hidden></aside>
  <div class="modal sk" id="modal" role="dialog" aria-modal="true" hidden></div>
  <div class="toasts" id="toasts"></div>

</body>
</html>

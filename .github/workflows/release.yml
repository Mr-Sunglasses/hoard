# Publishes the Docker image to ghcr.io/mr-sunglasses/hoard and creates a GitHub release.
#
#   git tag v1.2.0 && git push origin v1.2.0   →  image tags 1.2.0, 1.2, 1 and latest
#
# The version in pyproject.toml must match the tag. Every check in ci.yml runs first.
# After the first release, make the package public once: GitHub → your profile → Packages →
# hoard → Package settings → Change visibility.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/mr-sunglasses/hoard   # registry names must be lowercase

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub release
      packages: write        # push to ghcr.io
      id-token: write        # sign the build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME but pyproject.toml says $version"; exit 1; }

      - uses: docker/setup-qemu-action@v3      # build arm64 (Raspberry Pi, many NAS boxes) on an amd64 runner
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: this version's section of CHANGELOG.md.
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "Hoard $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

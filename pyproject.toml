[project]
name = "hoard"
version = "0.1.0"
description = "A hand-drawn, self-hosted shelf for your Hugging Face models."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "huggingface_hub>=0.34",
]

[tool.uv]
# Hoard is an app, not a library: install its dependencies only.
package = false
